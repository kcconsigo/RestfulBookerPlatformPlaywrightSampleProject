
name: Restful Booker Platform
on:
  push:
    branches: [ roomMenu ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '30 5 * 1-12 2,5,6'
    - cron: '30 5,17 * 1-12 2,5,6'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Not on Monday and Wednesday or Thursday
        if: github.event.schedule != '30 5 * 1-12 1,3,4'
        run: echo "This step will be skipped on Monday, Wednesday, and Thursday"
      - name: Every time
        run: echo "This step will always run"
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build & Install
        run: mvn -B install -D skipTests --no-transfer-progress
      - name: Ensure browsers are installed
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"
      - name: Install Playwright Operating System Dependencies
        run: npx playwright install-deps
      - name: Run tests
        run: mvn clean test -Dtest=LoginTest -U